<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Control Carwash Libre</title>
<meta name="description" content="App gratuita para gestionar tu autolavado: tickets, caja, asistencia y estadísticas. Funciona sin internet, instalable en tu celular." />
<meta name="theme-color" content="#FBF6EC" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Carwash Libre" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app"></div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const base = location.pathname.replace(/[^/]*$/, '');
      navigator.serviceWorker.register(base + 'sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
